{% extends "base.html" %}
{% block title %}Staff{% endblock %}
{% block page_title %}Staff{% endblock %}

{% block content %}
<div class="table-card">
    <div class="table-header">
        <h2 class="section-title">Staff Directory</h2>
        <div class="header-actions">
            <input type="text" class="search-input" placeholder="🔍 Search staff..." oninput="filterTable('staffTable', this.value)">
            <button class="btn btn-primary" onclick="openAddStaffModal()">+ Add Staff</button>
        </div>
    </div>
    <div class="table-wrapper">
        <table id="staffTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Designation</th>
                </tr>
            </thead>
            <tbody id="staffBody">
                <tr><td colspan="6" class="loading-cell">Loading from C++ backend…</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadStaff() {
    const data = await apiGet('/api/staff');
    const body = document.getElementById('staffBody');
    if (!data || !Array.isArray(data) || data.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty-cell">No staff found.</td></tr>';
        return;
    }
    body.innerHTML = data.map(s => `
        <tr>
            <td><span class="id-badge">${s.id}</span></td>
            <td><strong>${esc(s.name)}</strong></td>
            <td>${esc(s.email)}</td>
            <td>${esc(s.phone)}</td>
            <td><span class="badge badge-warning">${esc(s.department)}</span></td>
            <td>${esc(s.designation)}</td>
        </tr>
    `).join('');
}

function openAddStaffModal() {
    openModal('Add New Staff Member', `
        <form id="addStaffForm" onsubmit="submitAddStaff(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Staff ID</label>
                    <input type="number" class="form-control" id="st_id" placeholder="e.g. 303" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" id="st_name" placeholder="Full Name" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="st_email" placeholder="name@vit.edu" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" class="form-control" id="st_phone" placeholder="9876543232" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" class="form-control" id="st_dept" placeholder="Administration" required>
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" class="form-control" id="st_desig" placeholder="Office Coordinator" required>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Staff</button>
            </div>
        </form>
    `);
}

async function submitAddStaff(e) {
    e.preventDefault();
    const res = await apiPost('/api/staff/add', {
        id: document.getElementById('st_id').value,
        name: document.getElementById('st_name').value,
        email: document.getElementById('st_email').value,
        phone: document.getElementById('st_phone').value,
        department: document.getElementById('st_dept').value,
        designation: document.getElementById('st_desig').value,
    });
    if (res && res.success) {
        showToast('Staff added successfully!', 'success');
        closeModal();
        loadStaff();
    } else {
        showToast((res && res.message) || 'Failed to add staff.', 'error');
    }
}

loadStaff();
</script>
{% endblock %}
